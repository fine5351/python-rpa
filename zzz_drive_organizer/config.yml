# =====================================================================
# 絕區零 (Zenless Zone Zero) 驅動盤自動整理腳本配置檔案
# =====================================================================

# 熱鍵與運作全域設定
global_settings:
  hotkey_start: "F5"             # 啟動 / 繼續整理
  hotkey_stop: "F6"              # 暫停 / 停止整理
  grid_rows: 4                   # 網格行數 (預設 4 行)
  grid_cols: 7                   # 網格列數 (絕區零驅動倉庫實測一排 7 列)
  scroll_rows_per_page: 4        # 一頁處理完畢後向下滾動行數 (預設 4 行)
  auto_enhance_under_lv15: true  # 是否自動強化等級<15且初始有效詞條>=2的驅動盤至Lv15
  auto_confirm_dialog: true      # 棄置或強化時是否自動關閉確定彈窗
  click_delay: 0.15              # 操作間隔延遲 (秒)

# 全域預設門檻規則 (當驅動盤未在下方 drives 中單獨設定時套用，支援設定多組預設配置)
default_rules:
  - rule_name: "通用雙暴輸出流"
    desirable_substats:
      - "暴擊率"
      - "暴擊傷害"
      - "攻擊力%"
    min_threshold: 5             # Lv15 鎖定門檻：達 2 條鎖定

  - rule_name: "通用精通輔助流"
    desirable_substats:
      - "異常精通"
      - "攻擊力"
      - "穿透值"
      - "攻擊力%"
    min_threshold: 5             # 達 2 條鎖定

# 各驅動盤套裝規則設定 (支援單一驅動盤包含多組配置，支援指定部位 slots、主屬性 desirable_main_stats 與副屬性)
drives:
  # 使用者指定範例：拂曉行紀 1號位 生命值主屬性 雙暴攻擊副屬性
  - name: "拂曉行紀"
    rules:
      - rule_name: "1號位-雙暴輸出"
        slots: [1]                       # 僅套用於 1 號位 (若未設定則代表適用所有部位)
        desirable_main_stats:            # 允許的主屬性 (可選，1號位為生命值)
          - "生命值"
        desirable_substats:              # 所需副屬性
          - "攻擊力%"
          - "暴擊率"
          - "暴擊傷害"
        min_threshold: 2                 # 副屬性種類達 2 種以上
        min_total_rolls: 4               # (可選) 要求包含 +N 升級次數的總詞條數達 4 條以上 (例如 2+2=4 詞條)

      - rule_name: "4號位-雙暴主C"
        slots: [4]                       # 僅套用於 4 號位
        desirable_main_stats:            # 4 號位要求主屬性必須是暴擊率或暴擊傷害
          - "暴擊率"
          - "暴擊傷害"
        desirable_substats:
          - "攻擊力%"
          - "暴擊率"
          - "暴擊傷害"
        min_threshold: 2
        min_total_rolls: 4               # (可選) 要求包含 +N 升級次數的總詞條數達 4 條以上 (例如 2+2=4 詞條)

  # 範例二：啄木鳥電音
  - name: "啄木鳥電音"
    rules:
      - rule_name: "通用輸出"
        desirable_substats:
          - "暴擊率"
          - "暴擊傷害"
          - "攻擊力%"
          - "穿透力"
        min_threshold: 2